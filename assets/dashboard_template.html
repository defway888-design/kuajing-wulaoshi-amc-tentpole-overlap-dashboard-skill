<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>跨境吴老师 · Tentpole phase overlap数据看板</title>
  <style>
:root{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--border:#dbe3ee;--divider:#edf2f7;--title:#111827;--text:#334155;--muted:#64748b;--bar:#2563eb;--line:#d65a14;--buyer:#11875d;--limit:#b45309;--selected:#eff6ff;--grid:#e8eef6;font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{min-width:320px}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Microsoft YaHei","Segoe UI",Arial,sans-serif;letter-spacing:0}
button{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bar);outline-offset:3px}
.dashboard-header{background:#111827;border-top:4px solid var(--bar);color:#fff}
.header-inner{max-width:1320px;margin:0 auto;padding:21px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.header-logo{display:block;flex:none;width:auto;height:52px;max-width:40%;object-fit:contain;background:#fff;border:1px solid #e5e7eb;border-radius:4px}
h1{min-width:0;margin:0;color:#fff;font-size:30px;line-height:1.3;font-weight:700}
.wrap{max-width:1320px;margin:0 auto;padding:22px 24px 60px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.kpi,.panel{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 2px 8px rgba(15,23,42,.035)}
.kpi{padding:18px 20px 17px;border-top-width:4px;min-height:112px}
.kpi.sales{border-top-color:#67e8f9}
.kpi.spend{border-top-color:#5dadec}
.kpi.reach{border-top-color:#86efac}
.kpi.roas{border-top-color:#c4b5fd}
.kpi .label{display:inline-block;border-bottom:1px dotted #8792a2;color:var(--text);font-size:14px;font-weight:600;cursor:help}
.kpi-tooltip{position:fixed;z-index:20;max-width:min(270px,calc(100vw - 16px));padding:9px 11px;border:1px solid #8792a2;border-radius:6px;background:#fff;color:var(--text);box-shadow:0 10px 26px rgba(15,23,42,.13);font-size:12px;line-height:1.5;pointer-events:none}
.kpi strong{display:block;margin:14px 0 0;color:var(--title);font-size:30px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sectionhead{margin:24px 0 12px;padding-left:12px;border-left:4px solid var(--bar)}
.panel>.sectionhead{margin:0 0 17px}
.sectionhead h2{margin:0;color:var(--title);font-size:20px;line-height:1.35;font-weight:700}
.sectionhead.with-action{display:flex;align-items:center;justify-content:space-between;gap:12px}
.download-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none;padding:8px 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:var(--title);font-family:inherit;font-size:13px;font-weight:600;line-height:1.3;cursor:pointer}
.download-button:hover{border-color:var(--bar);background:#eff6ff}
.download-button:focus-visible{outline:2px solid var(--bar);outline-offset:2px}
.download-button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.panel{padding:22px;overflow:hidden}
.chart-legend-head{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--divider)}
.legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;color:var(--muted);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:2px;flex:none}
.dot.cyan{background:var(--bar)}
.dot.orange{background:var(--line)}
.dot.green{background:var(--buyer)}
.dot.green.line-key{width:17px;height:0;border-top:3px solid var(--buyer);border-radius:0;background:transparent;position:relative}
.dot.green.line-key::after{content:"";position:absolute;left:6px;top:-6px;width:6px;height:6px;border:2px solid var(--buyer);border-radius:50%;background:#fff}
.volume-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:8px;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain}
#volume-chart{display:block;width:100%;min-width:1100px;height:auto}
#phase-roas-chart{display:block;width:100%;min-width:1100px;height:auto}
.roas-panel{margin-top:0}
.table-panel{margin-top:24px}
.volume-grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.volume-axis{font-size:12px;font-variant-numeric:tabular-nums}
.volume-axis.blue{fill:var(--bar)}
.volume-axis.orange{fill:var(--line)}
.volume-axis.green{fill:var(--buyer)}
.volume-x{fill:#475569;font-size:13px;font-weight:600}
.volume-bar{rx:3}
.volume-buyer-line,.volume-buyer-point{pointer-events:none}
.volume-hit{fill:transparent;cursor:pointer}
.volume-hit:hover{fill:rgba(37,99,235,.045)}
.volume-hit.active{fill:rgba(37,99,235,.08)}
.volume-hit:focus-visible{outline:none;stroke:var(--title);stroke-width:2}
.volume-readout{margin-top:12px;padding:11px 14px;border:1px solid var(--divider);border-left:3px solid var(--bar);border-radius:5px;background:#f8fafc;color:var(--title);font-size:13px;line-height:1.6}
.volume-note{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
.phase-roas-value{fill:var(--title);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.phase-roas-average{stroke:var(--limit);stroke-width:2;stroke-dasharray:7 5}
.phase-roas-average-label{fill:var(--limit);font-size:12px;font-weight:700}
.dayrow{display:grid;grid-template-columns:210px minmax(0,1fr) 72px;align-items:center;gap:14px}
.dayrow{width:100%;min-height:44px;padding:11px 10px 11px 13px;border-top:1px solid var(--divider);color:var(--text)}
.dayrow:last-child{border-bottom:1px solid var(--divider)}
.pathlabel{color:var(--title);font-size:14px;font-weight:600;line-height:1.35}
.days-cell{color:var(--title);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:12px;overflow:hidden;background:#e8eef5;border-radius:99px}
.bar{height:100%;min-width:2px;border-radius:999px}
.bar.cyan{background:var(--bar)}
.daytrack{height:11px}
.tablewrap{max-width:100%;overflow:auto;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:1050px;font-variant-numeric:tabular-nums}
th,td{padding:11px 10px;border-bottom:1px solid var(--divider);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:#f8fafc;color:var(--text);font-size:12px;font-weight:700}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;min-width:170px;text-align:left;background:#fff}
th:first-child{z-index:2;background:#f8fafc}
tbody tr:nth-child(even) td{background:#f8fafc}
tbody tr:hover td{background:#eef4fc}
tbody tr.active td{background:var(--selected)}
tbody tr{cursor:pointer}
td{font-size:13px}
.flags{margin-left:4px;color:var(--limit);font-size:11px}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.header-inner{padding:18px 16px}.wrap{padding:18px 16px 46px}.panel{padding:17px}.dayrow{grid-template-columns:150px minmax(0,1fr) 70px;gap:8px}.sectionhead h2{font-size:18px}}
@media(max-width:520px){.header-inner{padding:14px 12px;gap:10px}.header-logo{height:42px;max-width:35%}.wrap{padding:14px 12px 40px}h1{font-size:22px}.kpis{grid-template-columns:1fr;gap:10px}.kpi{min-height:0;padding:15px 16px}.kpi strong{margin:10px 0 7px;font-size:26px}.dayrow{grid-template-columns:minmax(0,1fr) 90px;gap:6px}.dayrow .days-cell{grid-column:2;grid-row:1;text-align:right}.dayrow .daytrack{grid-column:1/-1;grid-row:2}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

  <script>
    'use strict';
    // Exact numeric fields needed by this view, copied from the supplied AMC CSV.
    const data = __TENTPOLE_DATA__;
    const known = n => typeof n === 'number' && Number.isFinite(n);
    const sum = key => data.every(d=>known(d[key])) ? data.reduce((n,d)=>n+d[key],0) : null;
    const totals = {reach:sum('reach'),sales:sum('sales'),spend:sum('spend'),buyers:sum('buyers'),ntbBuyers:sum('ntbBuyers')};
    const byId = id => data.find(d=>d.id===id);
    const money = n => known(n) ? n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
    const integer = n => known(n) ? n.toLocaleString('zh-CN') : '—';
    const pct = (n,d,precision=1) => known(n) && known(d) && d>0 ? (n/d*100).toFixed(precision)+'%' : '—';
    const roas = d => known(d.sales) && known(d.spend) && d.spend>0 ? d.sales/d.spend : null;
    const roasText = d => roas(d)===null ? '—' : roas(d).toFixed(2);
    const rate = d => known(d.buyers) && known(d.reach) && d.reach>0 ? d.buyers/d.reach : null;
    const $ = id => document.getElementById(id);
    const phaseOrder=['up','event','out','up-event','all','event-out','up-out'];
    const chartColors=Object.freeze({reach:'#2563eb',dpv:'#d65a14',buyers:'#11875d',roas:'#d65a14',spend:'#2563eb'});
    let activeId='up';
    const ordered = () => phaseOrder.map(byId);
    function select(id){
      const keepTableFocus=document.activeElement?.closest?.('#detail-body');
      activeId=id;render();
      if(keepTableFocus)document.querySelector('#detail-body [data-id="'+id+'"]').focus();
    }
    function renderDays(){
      const host=$('days-chart');host.replaceChildren();
      ordered().forEach(d=>{
        const row=document.createElement('div');row.className='dayrow';
        row.innerHTML='<div class="pathlabel">'+d.name+'</div><div class="track daytrack"><div class="bar cyan" style="width:'+(d.days/Math.max(...data.map(item=>item.days))*100)+'%"></div></div><div class="days-cell" title="组合所含阶段天数之和">'+d.days+' 天</div>';
        host.appendChild(row);
      });
    }
    const svgNS='http://www.w3.org/2000/svg';
    function svgEl(tag,attrs={},label){
      const el=document.createElementNS(svgNS,tag);
      Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,String(value)));
      if(label!==undefined)el.textContent=label;
      return el;
    }
    function renderVolumeChart(){
      const chart=$('volume-chart');chart.replaceChildren();
      const fixed=phaseOrder.map(byId);
       const width=1230,height=460,left=105,right=120,plotWidth=width-left-right,step=plotWidth/fixed.length;
      const top=64,base=360,plotHeight=base-top;
      chart.setAttribute('viewBox','0 0 '+width+' '+height);
      chart.appendChild(svgEl('title',{},'七种阶段组合的触达、详情页浏览柱形图与购买人数折线图'));
       chart.appendChild(svgEl('desc',{},'每个阶段组合有两根并排柱及一个绿色折线点。蓝色触达人数先除以一百，与橙色详情页浏览使用左轴；绿色购买人数保持原值，使用右侧次坐标轴。左右轴刻度不同，跨指标图形高度不代表原始人数比例；点选组合可读取原始数值。'));
       const reachDivisor=100;
      const barSeries=[
         {key:'reach',label:'触达人数',color:chartColors.reach},
         {key:'dpv',label:'详情页浏览',color:chartColors.dpv}
      ];
       const displayed=(spec,value)=>spec.key==='reach'?value/reachDivisor:value;
       const peak=Math.max(1,...fixed.flatMap(d=>barSeries.map(spec=>known(d[spec.key])?displayed(spec,d[spec.key]):0)));
       const unit=Math.pow(10,Math.floor(Math.log10(peak/4)));
       const axisMax=Math.max(4,Math.ceil(peak/unit)*unit);
       const buyerPeak=Math.max(0,...fixed.map(d=>known(d.buyers)?d.buyers:0));
       const buyerAxisMax=4*Math.max(1,Math.ceil(buyerPeak/4));
       chart.appendChild(svgEl('text',{class:'volume-axis blue',x:left-12,y:37,'text-anchor':'end'},'触达÷100 / 浏览'));
       chart.appendChild(svgEl('text',{class:'volume-axis green',x:width-right+12,y:37},'购买人数'));
      for(let tick=0;tick<=4;tick++){
        const y=base-tick*plotHeight/4;
        chart.appendChild(svgEl('line',{class:'volume-grid',x1:left,y1:y,x2:width-right,y2:y}));
         chart.appendChild(svgEl('text',{class:'volume-axis blue',x:left-12,y:y+4,'text-anchor':'end'},integer(axisMax*tick/4)));
         chart.appendChild(svgEl('text',{class:'volume-axis green',x:width-right+12,y:y+4},integer(buyerAxisMax*tick/4)));
      }
      const buyerPoints=[];
      fixed.forEach((d,index)=>{
        const center=left+(index+.5)*step;
         barSeries.forEach((spec,seriesIndex)=>{
           const value=d[spec.key];
           if(!known(value)) return;
           const barHeight=displayed(spec,value)/axisMax*plotHeight;
          const bar=svgEl('rect',{class:'volume-bar',x:center+(seriesIndex-1)*29-11,y:base-barHeight,width:22,height:barHeight,fill:spec.color,rx:3});
           bar.appendChild(svgEl('title',{},d.name+'：'+spec.label+' '+integer(value)+(spec.key==='reach'?'（柱形÷100）':'')));
          chart.appendChild(bar);
        });
        buyerPoints.push({x:center+29,y:known(d.buyers)?base-d.buyers/buyerAxisMax*plotHeight:null,d});
        const label=svgEl('text',{class:'volume-x',x:center,y:395,'text-anchor':'middle'});
        const parts=d.id==='all'?['预热+活动','+返场']:[d.name.replace(/ /g,'')];
        parts.forEach((part,line)=>label.appendChild(svgEl('tspan',{x:center,dy:line?16:0},part)));
        chart.appendChild(label);
        const hit=svgEl('rect',{class:'volume-hit',x:center-step/2+4,y:top,width:step-8,height:base-top+69,tabindex:0,role:'button','aria-label':d.name+'，触达人数 '+integer(d.reach)+' 人，详情页浏览 '+integer(d.dpv)+' 次，购买人数 '+integer(d.buyers)+' 人；选中该组合'});
        hit.appendChild(svgEl('title',{},d.name+'｜触达 '+integer(d.reach)+' 人 · 详情页浏览 '+integer(d.dpv)+' 次 · 购买 '+integer(d.buyers)+' 人'));
        hit.addEventListener('mouseenter',()=>updateVolumeReadout(d));
        hit.addEventListener('mouseleave',()=>updateVolumeReadout(byId(activeId)));
        hit.addEventListener('focus',()=>updateVolumeReadout(d));
        hit.addEventListener('blur',()=>updateVolumeReadout(byId(activeId)));
        hit.addEventListener('click',()=>select(d.id));
        hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(d.id)}});
        chart.appendChild(hit);
      });
      let segment=[];
      function drawBuyerSegment(){
        if(segment.length>1)chart.appendChild(svgEl('polyline',{class:'volume-buyer-line',points:segment.map(p=>p.x+','+p.y).join(' '),fill:'none',stroke:chartColors.buyers,'stroke-width':3,'stroke-linejoin':'round','stroke-linecap':'round'}));
        segment=[];
      }
      buyerPoints.forEach(point=>{if(point.y===null)drawBuyerSegment();else segment.push(point)});
      drawBuyerSegment();
      buyerPoints.forEach(point=>{if(point.y!==null){
        const marker=svgEl('circle',{class:'volume-buyer-point',cx:point.x,cy:point.y,r:5,fill:'#fff',stroke:chartColors.buyers,'stroke-width':3});
        marker.appendChild(svgEl('title',{},point.d.name+'：购买人数 '+integer(point.d.buyers)));
        chart.appendChild(marker);
      }});
    }
    function updateVolumeReadout(d){
      $('volume-readout').textContent=d.name+'｜触达人数 '+integer(d.reach)+' 人 · 详情页浏览 '+integer(d.dpv)+' 次 · 购买人数 '+integer(d.buyers)+' 人';
    }
    function renderPhaseRoasChart() {
  const chart = $('phase-roas-chart');
  chart.replaceChildren();
  const readout = $('roas-spend-readout');
  readout.hidden = true;
  readout.textContent = '';
  const fixed = phaseOrder.map(byId);
  const width = 1230, height = 355, left = 105, right = 155, top = 48, base = 270;
  const plotHeight = base - top;
  const step = (width - left - right) / fixed.length;
  const roasMax = Math.max(0.5, Math.ceil(Math.max(...fixed.map(d => roas(d) ?? 0)) * 1.1 * 10) / 10);
  const largestSpend = Math.max(1, ...fixed.map(d => known(d.spend) ? d.spend : 0));
  const spendUnit = Math.pow(10, Math.floor(Math.log10(largestSpend)));
  const spendMax = Math.ceil(largestSpend / spendUnit) * spendUnit;
  chart.setAttribute('viewBox', `0 0 ${width} ${height}`);
  chart.appendChild(svgEl('title', {}, '七种阶段组合的广告花费柱形图与 ROAS 折线图'));
  chart.appendChild(svgEl('desc', {}, '蓝色柱形表示广告花费，使用左轴；橙色折线表示 ROAS，使用右侧次坐标轴。点击或使用键盘选择某个阶段组合后，可在图表下方查看具体数值。'));
  chart.appendChild(svgEl('text', { class: 'volume-axis blue', x: left - 12, y: 29, 'text-anchor': 'end' }, '广告花费'));
  chart.appendChild(svgEl('text', { class: 'volume-axis orange', x: width - right + 12, y: 29 }, 'ROAS'));
  for (let tick = 0; tick <= 4; tick++) {
    const y = base - tick * plotHeight / 4;
    chart.appendChild(svgEl('line', { class: 'volume-grid', x1: left, y1: y, x2: width - right, y2: y }));
    chart.appendChild(svgEl('text', { class: 'volume-axis blue', x: left - 12, y: y + 4, 'text-anchor': 'end' }, integer(spendMax * tick / 4)));
    chart.appendChild(svgEl('text', { class: 'volume-axis orange', x: width - right + 12, y: y + 4 }, (roasMax * tick / 4).toFixed(2)));
  }
  const points = [];
  fixed.forEach((d, index) => {
    const center = left + (index + .5) * step;
    if (known(d.spend)) {
      const barHeight = d.spend / spendMax * plotHeight;
      const bar = svgEl('rect', { class: 'volume-bar', x: center - 30, y: base - barHeight, width: 60, height: barHeight, fill: chartColors.spend, rx: 3 });
      chart.appendChild(bar);
    }
    points.push({ center, y: roas(d)===null ? null : base - roas(d) / roasMax * plotHeight, d });
    const label = svgEl('text', { class: 'volume-x', x: center, y: 305, 'text-anchor': 'middle' });
    const parts = d.id === 'all' ? ['预热+活动', '+返场'] : [d.name.replace(/ /g, '')];
    parts.forEach((part, line) => label.appendChild(svgEl('tspan', { x: center, dy: line ? 16 : 0 }, part)));
    chart.appendChild(label);
  });
  let segment = [];
  function drawSegment() {
    if (segment.length > 1) chart.appendChild(svgEl('polyline', { class: 'roas-line', points: segment.map(point => `${point.center},${point.y}`).join(' '), fill: 'none', stroke: chartColors.roas, 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    segment = [];
  }
  points.forEach(point => { if (point.y===null) drawSegment(); else segment.push(point); });
  drawSegment();
  const hits = [];
  points.forEach(({ center, y, d }) => {
    if (y!==null) chart.appendChild(svgEl('circle', { cx: center, cy: y, r: 5, fill: '#fff', stroke: chartColors.roas, 'stroke-width': 3 }));
    const hit = svgEl('rect', { class: 'volume-hit', x: center - step / 2 + 4, y: top, width: step - 8, height: base - top + 58, tabindex: 0, role: 'button', 'aria-label': `${d.name}，点选查看广告花费与 ROAS`, 'aria-pressed': 'false' });
    function showValues() {
      hits.forEach(item => { item.setAttribute('class', 'volume-hit'); item.setAttribute('aria-pressed', 'false'); });
      hit.setAttribute('class', 'volume-hit active');
      hit.setAttribute('aria-pressed', 'true');
      readout.textContent = `${d.name}｜广告花费 ${money(d.spend)} · ROAS ${roasText(d)}`;
      readout.hidden = false;
    }
    hit.addEventListener('click', showValues);
    hit.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showValues(); }
    });
    chart.appendChild(hit);
    hits.push(hit);
  });
}
    function renderTable(){
      const host=$('detail-body');host.replaceChildren();
      ordered().forEach(d=>{const tr=document.createElement('tr');tr.dataset.id=d.id;tr.className=d.id===activeId?'active':'';tr.tabIndex=0;tr.setAttribute('aria-label',d.name+'，选中该组合');tr.innerHTML='<td><b>'+d.name+'</b>'+(known(d.buyers)&&d.buyers<=10?'<span class="flags" title="购买者不超过10人">小样本</span>':'')+'</td><td>'+integer(d.reach)+'</td><td>'+money(d.sales)+'</td><td>'+pct(d.sales,totals.sales,2)+'</td><td>'+money(d.spend)+'</td><td>'+roasText(d)+'</td><td>'+integer(d.buyers)+'</td><td>'+pct(d.buyers,d.reach,2)+'</td><td>'+integer(d.ntbBuyers)+'</td><td>'+d.days+'</td>';tr.addEventListener('click',()=>select(d.id));tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(d.id)}});host.appendChild(tr)});
    }
    function downloadDetail(){
      const headers=['触达阶段组合','触达人数','销售额','销售占比','广告费','ROAS','购买者','购买率','新客购买者','阶段天数'];
      const csvNumber=n=>known(n)?n:'';
      const csvMoney=n=>known(n)?n.toFixed(2):'';
      const csvPct=(n,d)=>known(n)&&known(d)&&d>0?pct(n,d,2):'';
      const rows=ordered().map(d=>[d.name,csvNumber(d.reach),csvMoney(d.sales),csvPct(d.sales,totals.sales),csvMoney(d.spend),roas(d)===null?'':roasText(d),csvNumber(d.buyers),csvPct(d.buyers,d.reach),csvNumber(d.ntbBuyers),d.days]);
      const cell=value=>'"'+String(value).replace(/"/g,'""')+'"';
      const csv=[headers,...rows].map(row=>row.map(cell).join(',')).join('\r\n');
      const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
      const link=document.createElement('a');link.href=url;link.download='Tentpole_phase_overlap_七种触达组合明细.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    function render(){renderDays();renderTable();updateVolumeReadout(byId(activeId))}
    function setupKpiTooltips(){
      const tip=document.createElement('div');tip.id='kpi-tooltip';tip.className='kpi-tooltip';tip.setAttribute('role','tooltip');tip.hidden=true;document.body.appendChild(tip);
      let owner=null;
      function hide(){if(owner)owner.removeAttribute('aria-describedby');owner=null;tip.hidden=true}
      function show(el){
        if(owner&&owner!==el)owner.removeAttribute('aria-describedby');
        owner=el;tip.textContent=el.dataset.tip;tip.hidden=false;el.setAttribute('aria-describedby','kpi-tooltip');
        const box=el.getBoundingClientRect(),width=tip.offsetWidth,height=tip.offsetHeight;
        let left=box.right+12,top=box.top;
        if(left+width>innerWidth-8)left=box.left-width-12;
        if(left<8){left=Math.max(8,Math.min(box.left,innerWidth-width-8));top=box.top-height-12;if(top<8)top=box.bottom+10}
        tip.style.left=left+'px';tip.style.top=Math.max(8,Math.min(top,innerHeight-height-8))+'px';
      }
      document.querySelectorAll('.kpi .label').forEach(el=>{
        el.dataset.tip=el.getAttribute('title');el.removeAttribute('title');el.setAttribute('aria-label',el.textContent+'：'+el.dataset.tip);
        el.addEventListener('mouseenter',()=>show(el));
        el.addEventListener('mouseleave',()=>{if(document.activeElement!==el)hide()});
        el.addEventListener('focus',()=>show(el));el.addEventListener('blur',hide);
        el.addEventListener('click',e=>{e.stopPropagation();show(el)});
        el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(el)}});
      });
      document.addEventListener('click',e=>{if(!e.target.closest('.kpi .label'))hide()});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
      window.addEventListener('resize',hide);
    }
    function init(){
      $('k-sales').textContent=money(totals.sales);$('k-spend').textContent=money(totals.spend);$('k-reach').textContent=integer(totals.reach);$('k-roas').textContent=known(totals.sales)&&known(totals.spend)&&totals.spend>0?(totals.sales/totals.spend).toFixed(2):'—';$('download-detail').addEventListener('click',downloadDetail);setupKpiTooltips();renderVolumeChart();renderPhaseRoasChart();render();
    }
    init();
  </script>
</body>
</html>
